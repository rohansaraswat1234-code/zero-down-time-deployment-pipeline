services:
  blue:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: zero-downtime-blue
    ports:
      - "5002:5000"
    environment:
      APP_VERSION: "v1"
      ENVIRONMENT: "blue"
    volumes:
      - ../../data:/data

  green:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: zero-downtime-green
    ports:
      - "5003:5000"
    environment:
      APP_VERSION: "v2"
      ENVIRONMENT: "green"
    volumes:
      - ../../data:/data

  nginx:
    image: nginx:alpine
    container_name: zero-downtime-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blue
      - green