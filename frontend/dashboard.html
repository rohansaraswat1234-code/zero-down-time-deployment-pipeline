<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Downtime Deployment Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .healthy {
            color: green;
        }

        .failed {
            color: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #222;
            color: white;
        }

        .section {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<h1>Zero Downtime Deployment Dashboard</h1>

<div class="cards">

    <div class="card">
        <h3>Environment</h3>
        <div id="environment" class="value">Loading...</div>
    </div>

    <div class="card">
        <h3>Version</h3>
        <div id="version" class="value">Loading...</div>
    </div>

    <div class="card">
        <h3>Health</h3>
        <div id="health" class="value">Loading...</div>
    </div>

    <div class="card">
        <h3>Total Deployments</h3>
        <div id="totalDeployments" class="value">0</div>
    </div>

</div>


<div class="cards">

    <div class="card">
        <h3>Successful Deployments</h3>
        <div id="successCount" class="value">0</div>
    </div>

    <div class="card">
        <h3>Failed Deployments</h3>
        <div id="failedCount" class="value">0</div>
    </div>

    <div class="card">
        <h3>Success Rate</h3>
        <div id="successRate" class="value">0%</div>
    </div>

    <div class="card">
        <h3>Pipeline Status</h3>
        <div id="pipelineStatus" class="value">Loading...</div>
    </div>

</div>


<div class="section">

<h2>Deployment History</h2>

<table>

    <thead>
        <tr>
            <th>Timestamp</th>
            <th>From Environment</th>
            <th>To Environment</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="deploymentTable"></tbody>

</table>

</div>


<script>

const API = "http://localhost:8080";

async function loadDashboard() {

    try {

        const healthResponse =
            await fetch(`${API}/health`);

        const health =
            await healthResponse.json();

        const healthElement =
            document.getElementById("health");

        healthElement.innerText =
            health.status;

        if (health.status === "healthy") {
            healthElement.className =
                "value healthy";
        }


        const versionResponse =
            await fetch(`${API}/version`);

        const version =
            await versionResponse.json();

        document.getElementById("environment").innerText =
            version.environment;

        document.getElementById("version").innerText =
            version.version;


        const deploymentResponse =
            await fetch(`${API}/deployments`);

        const deploymentData =
            await deploymentResponse.json();

        const deployments =
            deploymentData.deployments;

        document.getElementById("totalDeployments").innerText =
            deploymentData.total_deployments;


        let success = 0;
        let failed = 0;

        deployments.forEach(deployment => {

            if (deployment.status === "SUCCESS") {
                success++;
            }

            if (deployment.status === "FAILED") {
                failed++;
            }

        });


        document.getElementById("successCount").innerText =
            success;

        document.getElementById("failedCount").innerText =
            failed;


        let successRate = 0;

        if (deployments.length > 0) {

            successRate =
                ((success / deployments.length) * 100).toFixed(1);

        }

        document.getElementById("successRate").innerText =
            successRate + "%";


        const pipelineStatus =
            document.getElementById("pipelineStatus");

        if (health.status === "healthy") {

            pipelineStatus.innerText =
                "Operational";

            pipelineStatus.className =
                "value healthy";

        } else {

            pipelineStatus.innerText =
                "Problem";

            pipelineStatus.className =
                "value failed";

        }


        const table =
            document.getElementById("deploymentTable");

        table.innerHTML = "";

        deployments
            .slice()
            .reverse()
            .forEach(deployment => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${deployment.timestamp}</td>
                    <td>${deployment.from_environment}</td>
                    <td>${deployment.to_environment}</td>
                    <td>${deployment.status}</td>
                `;

                table.appendChild(row);

            });

    }

    catch (error) {

        console.error(
            "Dashboard Error:",
            error
        );

    }

}


loadDashboard();

setInterval(
    loadDashboard,
    5000
);

</script>

</body>
</html>
